<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль психолога | Eupsy</title>
</head>
<body>

    <div class="dashboard-layout">

        <aside class="sidebar" id="appSidebar"></aside>

        <div class="main-wrapper">

            <header class="topbar" id="appTopbar">
                <a href="/pages/client.html?section=catalog" class="btn-back">← Назад к каталогу</a>
                <div class="topbar-actions"></div>
            </header>

            <div class="content-row">
                <main class="main-content">
                    <div id="psychologistProfile">
                        <!-- Заполняется JS -->
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО БРОНИРОВАНИЯ -->
    <div class="modal-overlay" id="bookingModalOverlay">
        <div class="modal">
            <h3>Запись на сессию</h3>

            <div class="booking-summary" id="bookingSummary"></div>

            <div class="form-group">
                <label for="bookingClientName">Имя и отчество</label>
                <input type="text" id="bookingClientName" placeholder="Анна Сергеевна" required>
                <span class="form-error" id="bookingClientNameError"></span>
            </div>

            <div class="form-group">
                <label for="bookingTopic">Тема обращения</label>
                <input type="text" id="bookingTopic" placeholder="Например: Тревога, отношения">
            </div>

            <div class="form-group checkbox-agree">
                <label class="checkbox-label">
                    <input type="checkbox" id="agreeCancelRules">
                    <span>
                        Я согласен с <a href="rules-cancel.html" target="_blank">правилами отмены</a>:
                        ≥48 ч — возврат 100%, 24–48 ч — возврат 50%, <24 ч — без возврата.
                        Форс-мажор решается через чат поддержки.
                    </span>
                </label>
                <span class="form-error" id="agreeCancelRulesError"></span>
            </div>

            <div class="modal-actions">
                <button class="btn-save" id="confirmBookingBtn">Забронировать</button>
                <button class="btn-cancel" id="cancelBookingBtn">Отмена</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/psychologist.js"></script>
</body>
</html>
