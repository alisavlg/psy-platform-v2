<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната | Eupsy</title>
</head>
<body>
    <div class="room-layout">

        <header class="room-topbar">
            <div class="room-topbar-left">
                <span class="room-status-dot" id="roomStatusDot"></span>
                <span class="room-status-text" id="roomStatus">Загрузка комнаты...</span>
            </div>
            <div class="room-topbar-center">
                <div class="room-peer-name" id="roomPeerName">—</div>
                <div class="room-peer-role" id="roomPeerRole">—</div>
            </div>
            <div class="room-topbar-right">
                <span class="room-my-name" id="roomMyName"></span>
                <a class="room-leave-btn" id="leaveBtn" href="#">Завершить</a>
            </div>
        </header>

        <main class="room-main" id="roomMain">
                        <!-- Окна для видео -->
            <video id="remoteVideo" autoplay playsinline style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #0f172a; object-fit: cover;"></video>
            <video id="localVideo" autoplay playsinline muted style="width: 200px; height: 150px; position: absolute; bottom: 20px; right: 20px; border-radius: 10px; overflow: hidden; border: 2px solid #fff; z-index: 10; background: #1e293b; object-fit: cover; transform: scaleX(-1);"></video>

            <!-- Индикатор загрузки -->
            <div class="room-loading" id="roomLoading">
                <div class="room-loading-spinner"></div>
                <p>Подключаемся к комнате...</p>
            </div>
        </main>

    </div>

    <script type="module" src="/src/pages/room.js"></script>
</body>
</html>
