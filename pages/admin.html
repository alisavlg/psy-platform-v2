<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка | Eupsy</title>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="appSidebar"></aside>

        <div class="main-wrapper">
            <header class="topbar" id="appTopbar"></header>

            <div class="content-row">
                <main class="main-content">
                    <!-- СВОДКА -->
                    <div id="dashboardSection"></div>

                    <!-- ЗАЯВКИ -->
                    <div id="applicationsSection" style="display:none;"></div>

                    <!-- ЧАТЫ ПОДДЕРЖКИ -->
                    <div id="supportChatsSection" style="display:none;">
                        <div class="messenger-layout" id="messengerLayoutSupport">
                            <div class="chats-panel">
                                <div class="chats-header"><h3>Обращения</h3></div>
                                <div class="chats-list" id="chatsListSupport"></div>
                            </div>
                            <div class="chat-window" id="chatWindowSupport"></div>
                        </div>
                    </div>

                                        <!-- ЧАТЫ ПОДДЕРЖКИ ПСИХОЛОГОВ -->
                    <div id="supportPsyChatsSection" style="display:none;">
                        <div class="messenger-layout" id="messengerLayoutSupportPsy">
                            <div class="chats-panel">
                                <div class="chats-header"><h3>Обращения психологов</h3></div>
                                <div class="chats-list" id="chatsListSupportPsy"></div>
                            </div>
                            <div class="chat-window" id="chatWindowSupportPsy"></div>
                        </div>
                    </div>

                    <!-- ЛИЧНЫЕ СООБЩЕНИЯ АДМИНА -->
                    <div id="adminChatsSection" style="display:none;">
                        <div class="messenger-layout" id="messengerLayoutAdmin">
                            <div class="chats-panel">
                                <div class="chats-header"><h3>Мои чаты</h3></div>
                                <div class="chats-list" id="chatsListAdmin"></div>
                            </div>
                            <div class="chat-window" id="chatWindowAdmin"></div>
                        </div>
                    </div>

                    <!-- ПОЛЬЗОВАТЕЛИ -->
                    <div id="usersSection" style="display:none;"></div>

                    <!-- ПРОФИЛЬ -->
                    <div id="profileSection" style="display:none;"></div>

                    <!-- ПЛАНИРОВЩИК (КАЛЕНДАРЬ) -->
                    <div id="calendarSection" style="display:none;">
                        <div class="calendar-toolbar">
                            <div class="calendar-nav">
                                <button class="btn-nav" id="prevWeek">←</button>
                                <span class="calendar-period" id="calendarPeriod">Ноябрь 2026</span>
                                <button class="btn-nav" id="nextWeek">→</button>
                                <button class="btn-today" id="todayBtn">Сегодня</button>
                            </div>
                            <div class="calendar-actions">
                                <button class="btn-add-event" id="addEventBtn">+ Событие</button>
                            </div>
                        </div>
                        <div class="calendar-wrapper">
                            <div class="calendar-grid" id="calendarGrid"></div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/admin.js"></script>
</body>
</html>
