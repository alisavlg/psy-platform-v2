<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка | Eupsy</title>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="appSidebar"></aside>

        <div class="main-wrapper">
            <header class="topbar" id="appTopbar"></header>

            <div class="content-row">
                <main class="main-content">
                    <!-- СВОДКА -->
                    <div id="dashboardSection"></div>

                    <!-- ЗАЯВКИ -->
                    <div id="applicationsSection" style="display:none;"></div>

                    <!-- СООБЩЕНИЯ -->
                    <div id="messagesSection" style="display:none;">
    <div class="messenger-hint">
        🔒 Все коммуникации — только внутри платформы. Контакты участников скрыты.
    </div>
    <div class="messenger-layout" id="messengerLayout">
        <div class="chats-panel">
            <div class="chats-header">
                <h3>Чаты</h3>
            </div>
            <div class="chats-list" id="chatsList"></div>
        </div>
        <div class="chat-window" id="chatWindow"></div>
    </div>
</div>

                    <!-- ПРОФИЛЬ ПОДДЕРЖКИ -->
                    <div id="profileSection" style="display:none;"></div>

                    <!-- ПОЛЬЗОВАТЕЛИ -->
                    <div id="usersSection" style="display:none;"></div>
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="/src/pages/admin.js"></script>
</body>
</html>
